.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#e6f2fb 0,#e6f2fb 35%,rgba(230,242,251,.0) 62%)}
.hero .w{position:relative;padding-top:30px;padding-bottom:60px;display:flex;gap:18px;align-items:center}
.hero img{width:130px;height:130px;border-radius:50%}
.hero h1{margin:0;font-size:clamp(34px,5vw,58px);color:var(--p);line-height:1}.hero h1 b{color:var(--g)}
.hero h2{margin:2px 0 8px;color:var(--d);font-size:clamp(20px,2.4vw,28px)}
.hero p{margin:0;font-weight:600}
.slogan{position:absolute;right:30px;top:40px;color:#fff;font-weight:800;font-size:22px;transform:rotate(-8deg);text-shadow:0 2px 6px rgba(0,0,0,.5);text-align:center;line-height:1.2}
.sp{margin-top:-42px;position:relative;z-index:5}
.sbox{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:12px;display:grid;grid-template-columns:2.2fr 1fr 1fr auto auto;gap:10px;align-items:center}
input,select,textarea{font:inherit;padding:12px;border:1px solid #c9d6e8;border-radius:8px;background:var(--card);color:var(--t);width:100%}
.req{background:linear-gradient(#1aa862,#128a4c);color:#fff;border:0;border-radius:10px;padding:8px 20px;font:inherit;font-weight:700;cursor:pointer;text-align:left;line-height:1.2;font-size:17px}.req small{display:block;font-size:11px;font-weight:500}
.main{display:grid;grid-template-columns:1fr 340px;gap:22px;margin-top:22px}
h2.s{margin:0;color:var(--p);font-size:24px;border-left:4px solid var(--g);padding-left:10px;line-height:1.2}
.sub{color:var(--t2);margin:2px 0 12px 14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.c{border:0;padding:0;border-radius:10px;overflow:hidden;background:none;cursor:pointer;color:#fff;box-shadow:var(--sh);transition:.2s;font:inherit;text-align:left;display:flex;flex-direction:column}
.c:hover{transform:translateY(-4px)}.c img{width:100%;height:84px;object-fit:cover;display:block}
.c .lb{padding:8px 6px 8px 8px;font-weight:700;font-size:12.5px;line-height:1.2;min-height:40px;display:flex;align-items:center;gap:6px;flex:1}
.c .lb i{font-style:normal;background:rgba(255,255,255,.9);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;flex:none;font-size:14px}
.c .ds{font-size:10.5px;font-weight:400;opacity:.9;display:block}
.promo{background:var(--card);border-radius:12px;box-shadow:var(--sh);padding:14px;position:relative;overflow:hidden}
.promo h3{color:var(--p);margin:0 0 8px;font-size:17px;max-width:62%}.promo ul{padding:0;margin:0 0 10px;max-width:68%;font-size:13px}.promo li{list-style:none;margin:6px 0;font-weight:500}.promo li:before{content:"✔";color:#fff;background:var(--g);border-radius:50%;font-size:10px;display:inline-grid;place-items:center;width:17px;height:17px;margin-right:6px}
.promo .wk{position:absolute;right:0;top:0;height:215px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}.mini div{background:#eef5fd;color:var(--p);border-radius:8px;padding:8px 2px;text-align:center;font-size:10px;font-weight:600}.mini span{font-size:20px;display:block}
.bot{display:grid;grid-template-columns:1fr 1.3fr;gap:22px;margin-top:22px}
.steps{display:flex;align-items:flex-start;gap:6px;margin-top:6px}

<script type="module">

  // Initialize Firebase

  const auth = getAuth(app);

  window.gmAuth = async (k, d) => {
    if (k === "reg") {
      const c = await createUserWithEmailAndPassword(auth, d.email, d.pw);
      await updateProfile(c.user, { displayName: d.name });

  };
  window.gmOut = () => signOut(auth);
  window.gmList = async () => {
    const u = auth.currentUser;
    const rs = await getDoc(doc(db, "users", u.uid));
    const admin = rs.exists() && rs.data().role === "admin";
    const q = admin ? collection(db, "requests") : query(collection(db, "requests"), where("uid", "==", u.uid));
