.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#e6f2fb 0,#e6f2fb 35%,rgba(230,242,251,.0) 62%)}
.hero .w{position:relative;padding-top:30px;padding-bottom:60px;display:flex;gap:18px;align-items:center}
.hero img{width:130px;height:130px;border-radius:50%}
.hero h1{margin:0;font-size:clamp(34px,5vw,58px);color:var(--p);line-height:1}.hero h1 b{color:var(--g)}
.hero h2{margin:2px 0 8px;color:var(--d);font-size:clamp(20px,2.4vw,28px)}
.hero p{margin:0;font-weight:600}
.slogan{position:absolute;right:30px;top:40px;color:#fff;font-weight:800;font-size:22px;transform:rotate(-8deg);text-shadow:0 2px 6px rgba(0,0,0,.5);text-align:center;line-height:1.2}
.sp{margin-top:14px;position:relative;z-index:5}
.sbox{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:12px;display:grid;grid-template-columns:2.2fr 1fr 1fr auto auto;gap:10px;align-items:center}
input,select,textarea{font:inherit;padding:12px;border:1px solid #c9d6e8;border-radius:8px;background:var(--card);color:var(--t);width:100%}
.req{background:linear-gradient(#1aa862,#128a4c);color:#fff;border:0;border-radius:10px;padding:8px 20px;font:inherit;font-weight:700;cursor:pointer;text-align:left;line-height:1.2;font-size:17px}.req small{display:block;font-size:11px;font-weight:500}
.main{display:grid;grid-template-columns:1fr 340px;gap:22px;margin-top:22px}
h2.s{margin:0;color:var(--p);font-size:24px;border-left:4px solid var(--g);padding-left:10px;line-height:1.2}
.sub{color:var(--t2);margin:2px 0 12px 14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.c{border:0;padding:0;border-radius:10px;overflow:hidden;background:none;cursor:pointer;color:#fff;box-shadow:var(--sh);transition:.2s;font:inherit;text-align:left;display:flex;flex-direction:column}
.c:hover{transform:translateY(-4px)}.c img{width:100%;height:84px;object-fit:cover;display:block}
.c .lb{padding:8px 6px 8px 8px;font-weight:700;font-size:12.5px;line-height:1.2;min-height:40px;display:flex;align-items:center;gap:6px;flex:1}
.c .lb i{font-style:normal;background:rgba(255,255,255,.9);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;flex:none;font-size:14px}
.c .ds{font-size:10.5px;font-weight:400;opacity:.9;display:block}
.promo{background:var(--card);border-radius:12px;box-shadow:var(--sh);padding:14px;position:relative;overflow:hidden}
.promo h3{color:var(--p);margin:0 0 8px;font-size:17px;max-width:62%}.promo ul{padding:0;margin:0 0 10px;max-width:68%;font-size:13px}.promo li{list-style:none;margin:6px 0;font-weight:500}.promo li:before{content:"✔";color:#fff;background:var(--g);border-radius:50%;font-size:10px;display:inline-grid;place-items:center;width:17px;height:17px;margin-right:6px}
.promo .wk{position:absolute;right:0;top:0;height:215px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}.mini div{background:#eef5fd;color:var(--p);border-radius:8px;padding:8px 2px;text-align:center;font-size:10px;font-weight:600}.mini span{font-size:20px;display:block}
.bot{display:grid;grid-template-columns:1fr 1.3fr;gap:22px;margin-top:22px}
.steps{display:flex;align-items:flex-start;gap:6px;margin-top:6px}
.st{flex:1;text-align:center;font-size:12px;color:var(--t2)}.st .ic{width:62px;height:62px;border-radius:50%;background:#e4eefb;margin:auto;display:grid;place-items:center;font-size:30px}.st b{display:block;color:var(--p);font-size:13px;margin-top:6px}.st b em{background:var(--p);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center;font-style:normal;font-size:11px;margin-right:4px}.ar{color:var(--g);align-self:center;font-size:20px}
.band{border-radius:12px;color:#fff;padding:20px 22px;background:linear-gradient(120deg,rgba(7,59,120,.92),rgba(7,80,100,.8)),linear-gradient(#2a5d8f,#1f5a45)}
.band h2{margin:0 0 4px;font-size:21px}.band p{margin:0 0 14px;font-size:13px;max-width:460px}
.stats{display:flex;flex-wrap:wrap;gap:18px 30px}.stats div{display:flex;gap:10px;align-items:center}.stats b{font-size:24px;display:block;line-height:1}.stats span{font-size:12px}.stats i{font-style:normal;font-size:32px}
footer{background:var(--d);color:#fff;margin-top:26px;padding:16px 0 90px;font-size:14px}
.fg{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;align-items:center}footer a{color:#cfe3ff}
.so a{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;color:#000;text-decoration:none;margin-left:6px;font-size:13px;font-weight:700}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#25D366;color:#fff;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;text-decoration:none;box-shadow:var(--sh);z-index:30}
dialog{border:0;border-radius:16px;padding:20px;max-width:440px;width:92%;background:var(--card);color:var(--t)}dialog::backdrop{background:rgba(0,0,0,.5)}dialog label{display:block;margin:8px 0 3px;font-weight:600;font-size:13px}.note{font-size:12px;color:var(--t2)}.empty{padding:20px;color:var(--t2);grid-column:1/-1}
.dd{position:relative}.dd>a:first-child{color:var(--t);border-color:transparent}.dd:hover>a:first-child{border-color:var(--g)}.dm{display:none;position:absolute;top:100%;left:-10px;background:var(--card);box-shadow:var(--sh);border-radius:10px;padding:8px;min-width:240px;z-index:40}.dd:hover .dm,.dd:focus-within .dm{display:block}.dm a{display:block;padding:7px 10px;border:0!important;border-radius:6px;font-weight:500}.dm a:hover{background:var(--bg)}nav a.bk{background:var(--g);color:#fff;padding:7px 14px;border-radius:8px;border:0}
.ab{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}.abc{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:18px}.abc h3{margin:0 0 6px;color:var(--p);font-size:18px}.abc p{margin:0;font-size:14px;color:var(--t2)}
.vm{display:grid;gap:14px}.vm .abc{border-left:5px solid var(--g)}.vm .abc:last-child{border-color:var(--p)}
.abv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}.abv .abc{text-align:center}.abv i{font-style:normal;font-size:32px;display:block}
.abs{background:linear-gradient(120deg,#073B78,#0b5a46);color:#fff;border-radius:14px;padding:22px;margin-top:14px}.abs h3{margin:0 0 10px;font-size:20px}.abs ul{margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 20px}.abs li{list-style:none;font-size:14px}.abs li:before{content:"\2714";color:#7be3a8;margin-right:8px}.abs p{margin:14px 0 0;opacity:.95}.abs .btn{margin:14px 8px 0 0}
@media(max-width:900px){.ab{grid-template-columns:1fr}}
.mo{display:none}@media(max-width:1100px){.main,.bot{grid-template-columns:1fr}.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:820px){nav{display:none;position:absolute;top:72px;left:0;right:0;background:var(--card);flex-direction:column;padding:14px 20px;box-shadow:var(--sh)}nav.open{display:flex}.burger{display:block}.mo{display:block}.dd .dm{display:block;position:static;box-shadow:none;padding:0 0 0 12px}.hd{display:none!important}.sbox{grid-template-columns:1fr 1fr}.sbox>:first-child,.sbox>.req{grid-column:1/-1}.grid{grid-template-columns:repeat(2,1fr)}.hero img{display:none}.slogan{display:none}.hero:before{background:rgba(230,242,251,.75)}.promo h3,.promo ul{max-width:100%}.promo .wk{display:none}.steps{flex-direction:column}.ar{display:none}}
.bnr{display:block;line-height:0;background:#e6f2fb}.bnr img{display:block;width:100%;height:auto;min-height:130px;object-fit:cover;object-position:left center}

<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-analytics.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail, updateProfile } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, getDocs, updateDoc, query, where, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyAW-LcKDAjrC9IILBHw_mCIOlunOlF6a8s",
    authDomain: "gharmitra-gruop.firebaseapp.com",
    projectId: "gharmitra-gruop",
    storageBucket: "gharmitra-gruop.firebasestorage.app",
    messagingSenderId: "1055614613601",
    appId: "1:1055614613601:web:3b35fa021f809946b21220",
    measurementId: "G-9JG002GP9B"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  try { getAnalytics(app); } catch (e) {}

  // Firebase Authentication (enable Email/Password in Firebase Console > Authentication > Sign-in method)
  const auth = getAuth(app);
  const db = getFirestore(app);
  window.gmAuth = async (k, d) => {
    if (k === "reg") {
      const c = await createUserWithEmailAndPassword(auth, d.email, d.pw);
      await updateProfile(c.user, { displayName: d.name });
      try { await setDoc(doc(db, "users", c.user.uid), { name: d.name, email: d.email, phone: d.phone, role: "customer", createdAt: serverTimestamp() }); } catch (e) { console.error("Profile save failed", e); }
    } else if (k === "login") await signInWithEmailAndPassword(auth, d.email, d.pw);
    else if (k === "reset") await sendPasswordResetEmail(auth, d.email);
  };
  window.gmOut = () => signOut(auth);
  window.gmList = async () => {
    const u = auth.currentUser;
    const rs = await getDoc(doc(db, "users", u.uid));
    const admin = rs.exists() && rs.data().role === "admin";
    const q = admin ? collection(db, "requests") : query(collection(db, "requests"), where("uid", "==", u.uid));
    const s = await getDocs(q);
    const rows = s.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => ((b.createdAt && b.createdAt.seconds) || 0) - ((a.createdAt && a.createdAt.seconds) || 0));
    return { admin, rows };
  };
  window.gmStatus = (id, st) => updateDoc(doc(db, "requests", id), { status: st });
  window.gmBook = (d) => addDoc(collection(db, "bookings"), { ...d, status: "NEW", createdAt: serverTimestamp() });
  window.gmRequest = async (d) => {
    const no = "GM-" + Date.now().toString(36).toUpperCase();
    await addDoc(collection(db, "requests"), { ...d, requestNo: no, uid: auth.currentUser ? auth.currentUser.uid : null, status: "NEW", createdAt: serverTimestamp() });
    return no;
  };
  onAuthStateChanged(auth, (u) => {
    const $ = (i) => document.getElementById(i);
    $("bReg").style.display = $("bLogin").style.display = u ? "none" : "";
    $("bUser").style.display = u ? "flex" : "none";
    window.gmUser = u;
    $("uName").textContent = u ? (u.displayName || u.email) : "";
  });
</script>
