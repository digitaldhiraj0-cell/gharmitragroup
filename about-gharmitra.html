<style>
:root{--p:#0756A5;--d:#073B78;--g:#159B57;--bg:#F3F8FE;--card:#fff;--t:#172B4D;--t2:#64748B;--sh:0 4px 16px rgba(7,59,120,.13);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1626;--card:#13233b;--t:#e6eefb;--t2:#93a4bd;--sh:0 4px 16px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,"Noto Sans Devanagari",system-ui,sans-serif;line-height:1.6}
.w{max-width:1200px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.08)}.nav{display:flex;align-items:center;gap:16px;height:68px}
.logo{font-weight:800;font-size:24px;color:var(--p);text-decoration:none;line-height:1}.logo b{color:var(--g)}.logo small{display:block;font-size:12px}
nav{display:flex;gap:20px;margin:0 auto}nav a{color:var(--t);text-decoration:none;font-weight:600;font-size:14px}nav a:hover{color:var(--g)}
.btn{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:var(--g);text-decoration:none;display:inline-block}.btn.o{background:none;border:2px solid var(--p);color:var(--p)}
.hero{background:linear-gradient(120deg,rgba(7,59,120,.94),rgba(21,155,87,.8)),#073B78;color:#fff;padding:48px 0}.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px)}.hero p{margin:0;max-width:640px;opacity:.95}
h2.s{margin:0;color:var(--p);font-size:24px;border-left:4px solid var(--g);padding-left:10px}
footer{background:var(--d);color:#fff;padding:20px 0;margin-top:30px;font-size:14px}footer a{color:#cfe3ff}
.sec{margin-top:26px}.sec>p{margin:6px 0 0;color:var(--t2);max-width:820px}.stp{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:12px}.stp .abc b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--p);color:#fff;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.chips span{background:var(--card);box-shadow:var(--sh);border-radius:30px;padding:8px 16px;font-weight:600;font-size:14px;color:var(--p)}
.ct{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}.ct a{color:var(--p);font-weight:600;text-decoration:none}
@media(max-width:700px){nav{display:none}.nav .btn.o{margin-left:auto}}
.ab{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}.abc{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:18px}.abc h3{margin:0 0 6px;color:var(--p);font-size:18px}.abc p{margin:0;font-size:14px;color:var(--t2)}
.vm{display:grid;gap:14px}.vm .abc{border-left:5px solid var(--g)}.vm .abc:last-child{border-color:var(--p)}
.abv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}.abv .abc{text-align:center}.abv i{font-style:normal;font-size:32px;display:block}
.abs{background:linear-gradient(120deg,#073B78,#0b5a46);color:#fff;border-radius:14px;padding:22px;margin-top:14px}.abs h3{margin:0 0 10px;font-size:20px}.abs ul{margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 20px}.abs li{list-style:none;font-size:14px}.abs li:before{content:"\2714";color:#7be3a8;margin-right:8px}.abs p{margin:14px 0 0;opacity:.95}.abs .btn{margin:14px 8px 0 0}
@media(max-width:900px){.ab{grid-template-columns:1fr}}
.bnr{display:block;line-height:0;background:#e6f2fb}.bnr img{display:block;width:100%;height:auto;min-height:130px;object-fit:cover;object-position:left center}
.bnr{position:relative}.nw{position:absolute;right:1.1%;top:14%;width:clamp(150px,16.5vw,300px);background:transparent;color:#fff;border-radius:12px;padding:8px 12px;line-height:1.35;text-shadow:0 1px 3px rgba(0,0,0,.7),0 0 10px rgba(0,0,0,.5);text-align:center;font-family:Inter,"Noto Sans Devanagari",system-ui,sans-serif}.nw .nt{font-size:clamp(15px,1.9vw,26px);font-weight:800;letter-spacing:.5px}.nw .nl{font-size:clamp(9px,.8vw,12px);opacity:.85}.nw .nd{font-size:clamp(10px,1vw,14px);font-weight:600;margin-top:2px}
@media(max-width:700px){.nw{position:static;width:auto;border-radius:0;background:#073B78;text-shadow:none;display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:2px 14px;padding:6px 10px}.nw .nt{font-size:18px}.nw .nl{display:none}.nw .nd{font-size:12px;margin:0}}
